name: Build and Run Examples

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build and run (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven

      - name: Compile
        run: mvn -B -q -f Examples/pom.xml clean compile

      # run_all_examples.sh runs each example from its own directory, so the sample
      # files resolve, and exits non-zero if any example fails. `mvn exec:java` on its
      # own would run everything from Examples/, fail to find every input, and still
      # exit 0 -- a green tick that proves nothing.
      - name: Run examples
        run: ./run_all_examples.sh
